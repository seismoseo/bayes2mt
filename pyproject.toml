[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes2mt"
version = "0.1.1"
description = "Second-degree moment inversion of small earthquakes from EGF-derived apparent source time functions, deterministic (CVXPY) and hierarchical Bayesian (BayesBay)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Min-Seong Seo"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5,<3",
    "matplotlib>=3.7",
    "obspy>=1.4",
    "numba>=0.58",
]

[project.optional-dependencies]
deterministic = ["cvxpy>=1.4", "scs>=3.2"]
bayesian = ["bayesbay==0.3.4", "arviz>=0.17"]
interactive = ["ipywidgets>=7.8"]
all = ["bayes2mt[deterministic,bayesian,interactive]"]
dev = ["bayes2mt[all]", "pytest", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bayes2mt = ["data/*.nd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
